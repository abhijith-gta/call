 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SwapLoop - Video Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: rgba(28, 28, 30, 0.65);
            --header-bg: rgba(15, 15, 18, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.05);
            --msg-sent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --msg-received: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
        }
        
        .hidden { display: none !important; }

        .satin-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toggle-btn {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .toggle-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        #video-area {
            position: relative; background: #000; flex-grow: 1; overflow: hidden;
            display: flex; flex-direction: column; transition: all 0.3s ease;
        }
        @media (min-width: 768px) { #video-area { flex-direction: row; } }

        .video-wrapper {
            position: relative; flex: 1; width: 100%; height: 100%; background: #0a0a0a;
            border-bottom: 2px solid var(--accent); display: flex; align-items: center;
            justify-content: center; overflow: hidden; transition: all 0.3s ease;
        }
        @media (min-width: 768px) {
            .video-wrapper { border-bottom: none; border-right: 2px solid var(--accent); }
            .video-wrapper:last-child { border-right: none; }
        }

        @media (min-width: 768px) {
            #chat-ui.creator-active #video-area {
                display: grid; grid-template-columns: 380px 1fr; 
                grid-template-rows: calc(50% - 8px) calc(50% - 8px); gap: 16px; padding: 16px; background: var(--bg);
            }
            #chat-ui.creator-active .video-wrapper { border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
            #chat-ui.creator-active #remote-wrapper { grid-column: 1; grid-row: 1; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
            #chat-ui.creator-active #local-wrapper { grid-column: 1; grid-row: 2; border-right: 1px solid var(--border); }
            #chat-ui.creator-active #chat-overlay {
                position: relative; bottom: auto; left: auto; transform: none; width: 100%; height: 100%;
                max-width: none; grid-column: 2; grid-row: 1 / span 2; opacity: 1; pointer-events: auto; border-radius: 12px; display: flex;
            }
            #chat-ui.creator-active #close-chat, #chat-ui.creator-active #chat-toggle { display: none; }
        }

        #remote-video, #local-video { width: 100%; height: 100%; object-fit: cover; }
        #remote-video { opacity: 0; transition: opacity 0.5s ease; }
        #remote-video.active { opacity: 1; }
        #local-video { transform: scaleX(-1); }

        .status-pill {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--surface);
            backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 999px; padding: 8px 20px;
            display: flex; align-items: center; gap: 12px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .control-area {
            background: var(--surface); backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 15px; z-index: 30;
        }

        .btn-control {
            background: var(--input-bg); color: var(--text-primary); border-radius: 50%; width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); cursor: pointer; transition: all 0.3s;
        }
        .btn-control.off { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
        .btn-control:hover:not(.stop) { transform: translateY(-2px); border-color: var(--accent); }

        /* Stop Button CSS */
        .btn-control.stop { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: #ef4444; }
        .btn-control.stop:hover { background: #ef4444; color: white; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(239,68,68,0.4); }
        
        .btn-skip {
            background: var(--accent-gradient); color: white; border-radius: 50%; width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center; border: none; transition: all 0.3s;
        }
        .btn-skip:hover { transform: scale(1.05); box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-skip:active { transform: scale(0.95); }

        #chat-overlay {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); width: 90%; max-width: 350px; height: 320px;
            background: var(--surface); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 20px;
            z-index: 40; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        #chat-overlay.active { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }

        .chat-bubble { max-width: 85%; padding: 8px 14px; border-radius: 18px; font-size: 0.85rem; line-height: 1.4; word-wrap: break-word; margin-bottom: 6px; }
        .sent { background: var(--msg-sent); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
        .received { background: var(--msg-received); align-self: flex-start; border-bottom-left-radius: 4px; color: var(--text-primary); border: 1px solid var(--border); }

        #chat-badge { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; background: #ef4444; border-radius: 50%; border: 2px solid var(--surface); display: none; }
        .glass-input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text-primary); }
        .glass-input:focus { outline: none; border-color: var(--accent); }

        #ai-warning {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(239, 68, 68, 0.95);
            color: white; padding: 12px 24px; border-radius: 12px; font-weight: bold; z-index: 100; display: none;
            backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); text-align: center; border: 1px solid #f87171;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- 24HR BAN SCREEN -->
    <div id="ban-screen" class="fixed inset-0 z-[999] hidden flex-col items-center justify-center p-4 bg-black text-center">
        <h1 class="text-5xl mb-4">🚫</h1>
        <h2 class="text-3xl font-bold text-red-500 mb-2">BANNED</h2>
        <p class="text-gray-300">Explicit content detected. You are banned for 24 hours.</p>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">                
        <div class="satin-card w-full max-w-sm p-8 rounded-[2rem] text-center">
            <div class="text-4xl mb-4">📹</div>
            <h1 class="text-3xl font-bold mb-2">Video Call</h1>
            <p id="ai-loading-text" class="text-xs text-[var(--accent)] font-semibold mb-4 animate-pulse">Loading AI Safety Module...</p>
            
            <div class="space-y-4">
                <input id="nickname-input" type="text" placeholder="Enter Nickname" class="glass-input w-full p-3 rounded-xl text-center font-medium">
                
                <div class="text-left mt-2">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-2 block">I am</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="toggle-btn p-3 rounded-xl font-semibold text-sm" data-group="gender" data-val="male">Male</button>
                        <button class="toggle-btn p-3 rounded-xl font-semibold text-sm" data-group="gender" data-val="female">Female</button>
                    </div>
                </div>
                
                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-2 block">Looking for</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="toggle-btn p-2 rounded-lg text-xs" data-group="looking" data-val="male">Male</button>
                        <button class="toggle-btn p-2 rounded-lg text-xs" data-group="looking" data-val="female">Female</button>
                        <button class="toggle-btn active p-2 rounded-lg text-xs" data-group="looking" data-val="anyone">Anyone</button>
                    </div>
                </div>

                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-2 block">Layout Mode</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="toggle-btn active p-3 rounded-xl font-semibold text-sm" data-group="mode" data-val="normal">Normal</button>
                        <button class="toggle-btn p-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-1" data-group="mode" data-val="creator">🎬 Creator</button>
                    </div>
                </div>

                <button id="start-button" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold p-3.5 rounded-xl mt-2 shadow-lg disabled:opacity-50" disabled>
                    Start Camera
                </button>
            </div>
        </div>
    </div>

    <!-- CALL UI -->
    <div id="chat-ui" class="flex flex-col h-full hidden absolute inset-0">
        
        <div class="h-16 flex items-center px-6 shrink-0 z-10 relative shadow-sm justify-between" style="background: var(--header-bg); border-bottom: 1px solid var(--border);">
            <div class="text-2xl md:text-3xl font-extrabold tracking-widest cursor-default" style="color: var(--accent); text-shadow: 0 0 15px var(--accent-glow);">
                swaploop.in
            </div>
        </div>

        <div id="video-area">
            
            <div class="status-pill">
                <h2 id="partner-nickname" class="text-sm font-bold tracking-wide">Stranger</h2>
                <div class="w-px h-4 bg-[var(--text-secondary)] opacity-30"></div>
                <div class="flex items-center gap-2">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]"></span>
                    <p id="status-text" class="text-[0.7rem] font-extrabold text-yellow-500 uppercase tracking-wider mt-0.5">Searching...</p>
                </div>
            </div>

            <div id="ai-warning">⚠️ Warning</div>

            <div id="remote-wrapper" class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <div id="waiting-indicator" class="absolute inset-0 flex flex-col items-center justify-center text-white/50 z-10 hidden">
                    <span class="text-5xl mb-4 animate-pulse">🌍</span>
                    <p class="font-medium mt-2">Finding someone...</p>
                </div>
            </div>

            <div id="local-wrapper" class="video-wrapper">
                <video id="local-video" autoplay muted playsinline crossorigin="anonymous"></video>
            </div>

            <div id="chat-overlay">
                <div class="flex justify-between items-center p-3 border-b border-[var(--border)]">
                    <h3 class="font-semibold text-sm">Live Chat</h3>
                    <button id="close-chat" class="text-[var(--text-secondary)] hover:text-white text-xl leading-none">&times;</button>
                </div>
                <div id="messages-area" class="flex-grow p-3 overflow-y-auto flex flex-col scroll-smooth"></div>
                <form id="chat-form" class="p-2 border-t border-[var(--border)] flex gap-2 shrink-0">
                    <input id="chat-input" type="text" placeholder="Type a message..." class="glass-input flex-grow rounded-full px-4 py-2 text-sm" autocomplete="off" disabled>
                    <button type="submit" id="send-btn" class="bg-[var(--accent)] text-white rounded-full w-9 h-9 flex items-center justify-center disabled:opacity-50" disabled>
                        <svg class="w-4 h-4 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                    </button>
                </form>
            </div>
        </div>

        <div class="control-area shrink-0">
            <button id="mic-toggle" class="btn-control"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg></button>
            
            <button id="chat-toggle" class="btn-control relative">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                <div id="chat-badge"></div>
            </button>
            
            <button id="stop-button" class="btn-control stop" title="Stop Connection">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>

            <button id="next-button" class="btn-skip" title="Find Next">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>                                              

    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/2.8.5/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@2.4.1/dist/nsfwjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

    <script>
        if (localStorage.getItem('swaploop_ban_v3')) {
            const banExpiry = parseInt(localStorage.getItem('swaploop_ban_v3'));
            if (Date.now() < banExpiry) {
                document.getElementById('ban-screen').classList.remove('hidden');
                document.getElementById('setup-screen').classList.add('hidden');
                throw new Error("User is currently banned.");
            } else {
                localStorage.removeItem('swaploop_ban_v3');
            }
        }

        const socket = typeof io !== 'undefined' ? io() : { emit: () => {}, on: () => {} };

        let myGender = null, lookingFor = 'anyone', selectedMode = 'normal';
        let localStream = null, isChatOpen = false, peer = null; 
        
        let nsfwModel = null;
        let faceModel = null;
        let aiScanInterval = null;
        let noFaceTime = 0; 
        let connectedTime = 0; 
        let isScanning = false; 
        let nsfwStrikeCount = 0; 

        const ui = {
            setupScreen: document.getElementById('setup-screen'),
            chatUI: document.getElementById('chat-ui'),
            startBtn: document.getElementById('start-button'),
            aiLoadingText: document.getElementById('ai-loading-text'),
            aiWarning: document.getElementById('ai-warning'),
            nickInput: document.getElementById('nickname-input'),
            partnerName: document.getElementById('partner-nickname'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            localVideo: document.getElementById('local-video'),
            remoteVideo: document.getElementById('remote-video'),
            videoArea: document.getElementById('video-area'),
            waitingInd: document.getElementById('waiting-indicator'),
            chatOverlay: document.getElementById('chat-overlay'),
            chatToggle: document.getElementById('chat-toggle'),
            chatBadge: document.getElementById('chat-badge'),
            closeChat: document.getElementById('close-chat'),
            msgArea: document.getElementById('messages-area'),
            chatForm: document.getElementById('chat-form'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn') 
        };

        // Fallback Loading: Tries /models/ -> /model/ -> Online CDN
        Promise.all([
            nsfwjs.load('/models/')
                .catch(() => nsfwjs.load('/model/'))
                .catch(() => nsfwjs.load()), 
            blazeface.load()
        ]).then(([nsfw, face]) => {
            nsfwModel = nsfw; faceModel = face;
            ui.aiLoadingText.textContent = "✅ AI Safety Module & Face Tracking Active";
            ui.aiLoadingText.classList.remove('animate-pulse'); ui.aiLoadingText.style.color = "#22c55e"; 
            ui.startBtn.disabled = false; 
        }).catch(err => {
            console.error("AI Error:", err);
            ui.aiLoadingText.textContent = "⚠️ Error: AI models failed to load. Check Adblock/Shields."; 
            ui.aiLoadingText.style.color = "#ef4444"; 
            ui.startBtn.disabled = false; 
        });

        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.dataset.group;
                document.querySelectorAll(`.toggle-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if(group === 'gender') myGender = btn.dataset.val;
                if(group === 'looking') lookingFor = btn.dataset.val;
                if(group === 'mode') selectedMode = btn.dataset.val;
            });
        });

        ui.startBtn.addEventListener('click', async () => {
            if (!myGender) return alert("Please select your gender.");
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                ui.localVideo.srcObject = localStream;
                if (nsfwModel && faceModel) { aiScanInterval = setInterval(scanVideoContent, 1000); }
            } catch (err) { alert("Camera/Mic access required!"); return; }

            if (selectedMode === 'creator') { ui.chatUI.classList.add('creator-active'); } 
            else { ui.chatUI.classList.remove('creator-active'); }

            socket.emit("set-nickname", ui.nickInput.value.trim() || "Anonymous");
            ui.setupScreen.classList.add('hidden'); ui.chatUI.classList.remove('hidden');
            
            updateStatus('disconnected', 'Ready');
            ui.statusText.textContent = "Click NEXT to connect";
            ui.statusText.style.color = "#a3a3a3";
            ui.statusDot.className = "w-2 h-2 rounded-full bg-gray-500";
            ui.waitingInd.classList.add('hidden');
        });

        async function scanVideoContent() {
            if (isScanning) return; 
            if (!nsfwModel || !faceModel || !ui.localVideo || ui.localVideo.paused || ui.localVideo.ended) return;
            if (ui.localVideo.readyState !== 4 || ui.localVideo.videoWidth === 0 || ui.localVideo.videoHeight === 0) return; 

            isScanning = true;

            try {
                // 1. Explicit NSFW Check with 3-Strike System
                const predictions = await nsfwModel.classify(ui.localVideo);
                
                const badContent = predictions.find(p => 
                    (p.className === 'Porn' && p.probability > 0.75) || 
                    (p.className === 'Hentai' && p.probability > 0.75) ||
                    (p.className === 'Sexy' && p.probability > 0.85) 
                );
                
                if (badContent) {
                    nsfwStrikeCount++; 
                    if (nsfwStrikeCount >= 3) {
                        if (peer) { peer.destroy(); peer = null; }
                        socket.emit("next");
                        localStorage.setItem('swaploop_ban_v3', Date.now() + 24 * 60 * 60 * 1000); 
                        location.reload();
                        return;
                    }
                } else {
                    nsfwStrikeCount = 0; 
                }

                // 2. 15s Face Check Timer
                if (peer && connectedTime > 0) {
                    const faces = await faceModel.estimateFaces(ui.localVideo, false);
                    if (faces.length === 0) {
                        noFaceTime++;
                        let timeLeft = 15 - noFaceTime;
                        
                        if (timeLeft > 0) {
                            ui.aiWarning.textContent = `⚠️ Show your face! Disconnecting in ${timeLeft}s`;
                            ui.aiWarning.style.display = 'block';
                        } else {
                            if (peer) { peer.destroy(); peer = null; }
                            ui.aiWarning.textContent = `⚠️ Call Cut: Face not detected.`;
                            setTimeout(() => { ui.aiWarning.style.display = 'none'; }, 2000);
                            noFaceTime = 0;
                            handleRemoteDisconnect();
                        }
                    } else {
                        noFaceTime = 0;
                        ui.aiWarning.style.display = 'none';
                    }
                } else {
                    noFaceTime = 0;
                    ui.aiWarning.style.display = 'none';
                }
            } catch (e) { 
                console.error("AI Scan Error:", e); 
            } finally {
                isScanning = false;
            }
        }

        function findPartner() {
            updateStatus('searching');
            connectedTime = 0; 
            noFaceTime = 0; 
            nsfwStrikeCount = 0; 
            ui.aiWarning.style.display = 'none';
            ui.remoteVideo.classList.remove('active');
            ui.remoteVideo.srcObject = null;
            ui.waitingInd.classList.remove('hidden'); 
            ui.msgArea.innerHTML = ''; 
            
            const interests = (sessionStorage.getItem('swaploop_interests') || "").split(',').map(s=>s.trim()).filter(Boolean);
            socket.emit("find-partner", { gender: myGender, lookingFor, type: 'video', interests });
        }

        // NEXT BUTTON
        document.getElementById('next-button').addEventListener('click', () => {
            if (peer) { peer.destroy(); peer = null; }
            socket.emit("next"); 
            findPartner();
        });
        
        // STOP BUTTON
        document.getElementById('stop-button').addEventListener('click', () => {
            if (peer) { peer.destroy(); peer = null; }
            socket.emit("next");
            updateStatus('disconnected', 'Stopped');
            connectedTime = 0;
            ui.remoteVideo.classList.remove('active');
            ui.remoteVideo.srcObject = null;
            ui.chatInput.disabled = true;
            ui.waitingInd.classList.add('hidden'); 
        });

        document.getElementById('mic-toggle').addEventListener('click', function() {
            if(localStream) {
                let enabled = localStream.getAudioTracks()[0].enabled;
                localStream.getAudioTracks()[0].enabled = !enabled;
                this.classList.toggle('off', enabled);
            }
        });

        function toggleChat() {
            isChatOpen = !isChatOpen;
            ui.chatOverlay.classList.toggle('active', isChatOpen);
            if(isChatOpen) { ui.chatBadge.style.display = 'none'; setTimeout(() => ui.chatInput.focus(), 300); }
        }
        ui.chatToggle.addEventListener('click', toggleChat);
        ui.closeChat.addEventListener('click', toggleChat);
        ui.chatInput.addEventListener('input', () => ui.sendBtn.disabled = !ui.chatInput.value.trim());

        ui.chatForm.addEventListener('submit', (e) => {
            e.preventDefault(); const msg = ui.chatInput.value.trim();
            if(msg) { socket.emit('send-message', { message: msg }); appendMsg(msg, 'sent'); ui.chatInput.value = ''; ui.sendBtn.disabled = true; }
        });

        function appendMsg(text, type) {
            const div = document.createElement('div'); div.className = `chat-bubble ${type}`; div.textContent = text;
            ui.msgArea.appendChild(div); ui.msgArea.scrollTop = ui.msgArea.scrollHeight;
        }

        socket.on('receive-message', ({ message }) => { appendMsg(message, 'received'); if(!isChatOpen) ui.chatBadge.style.display = 'block'; });

        socket.on('partner-found', ({ initiator, partnerNickname }) => {
            updateStatus('connected', partnerNickname);
            connectedTime = Date.now(); 
            ui.waitingInd.classList.add('hidden');
            ui.chatInput.disabled = false;

            peer = new SimplePeer({
                initiator: initiator, stream: localStream,
                config: { iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' } ] }
            });

            peer.on('signal', data => socket.emit('signal', data));
            peer.on('stream', stream => { ui.remoteVideo.srcObject = stream; ui.remoteVideo.classList.add('active'); });
            peer.on('close', handleRemoteDisconnect); peer.on('error', handleRemoteDisconnect);
        });

        socket.on('signal', data => { if(peer) peer.signal(data); });
        socket.on('partner-disconnected', handleRemoteDisconnect);

        function handleRemoteDisconnect() {
            if (peer) { peer.destroy(); peer = null; }
            updateStatus('disconnected', 'Stopped');
            connectedTime = 0;
            ui.remoteVideo.classList.remove('active');
            ui.remoteVideo.srcObject = null;
            ui.chatInput.disabled = true;
            ui.waitingInd.classList.add('hidden');
            socket.emit("next");
        }

        function updateStatus(state, name="Stranger") {
            ui.partnerName.textContent = name;
            if (state === 'searching') {
                ui.statusText.textContent = "Searching..."; ui.statusText.style.color = "#eab308";
                ui.statusDot.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]";
            } else if (state === 'connected') {
                ui.statusText.textContent = "Online"; ui.statusText.style.color = "#22c55e";
                ui.statusDot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]";
            } else {
                ui.statusText.textContent = "Disconnected"; ui.statusText.style.color = "#ef4444";
                ui.statusDot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]";
            }
        }
    </script>
</body>
</html>
