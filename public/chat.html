<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SwapLoop - Text Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* DARK MODE (Premium Neon Style) */
            --bg: #0a0a0a;
            --surface: rgba(28, 28, 30, 0.75);
            --header-bg: rgba(28, 28, 30, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
            --border: rgba(255, 255, 255, 0.08);
            
            /* Chat Bubble Colors */
            --msg-sent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --msg-sent-shadow: rgba(139, 92, 246, 0.25);
            --msg-received: rgba(255, 255, 255, 0.08);
            
            --input-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --header-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --border: rgba(0, 0, 0, 0.08);
            
            --msg-sent: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --msg-sent-shadow: rgba(99, 102, 241, 0.2);
            --msg-received: #f1f5f9;
            
            --input-bg: rgba(0, 0, 0, 0.04);
            --btn-hover: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100dvh; /* Dynamic Height for Mobile Keyboards */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.03), transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(217, 70, 239, 0.03), transparent 40%);
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--input-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover { 
            transform: scale(1.1) rotate(15deg); 
            border-color: var(--accent);
        }
        .theme-toggle:active { transform: scale(0.9); }

        /* Setup Card (Glassmorphism) */
        .satin-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        /* Toggles */
        .toggle-btn {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .toggle-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .toggle-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Chat UI Container */
        #chat-ui {
            background: var(--bg);
        }

        /* Header */
        .chat-header {
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        /* Message Bubbles */
        .chat-bubble {
            max-width: 82%;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 0.98rem;
            line-height: 1.45;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            transform-origin: bottom center;
            word-wrap: break-word;
            margin-bottom: 4px;
        }

        .sent {
            background: var(--msg-sent);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
            box-shadow: 0 4px 15px var(--msg-sent-shadow);
            transform-origin: bottom right;
        }

        .received {
            background: var(--msg-received);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
            border: 1px solid var(--border);
            transform-origin: bottom left;
        }

        @keyframes popIn { 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }

        /* Bottom Input Bar (Glassmorphism) */
        .input-area {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            /* Ensure padding accounts for mobile safe areas */
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .glass-input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .glass-input:focus { 
            outline: none; 
            border-color: var(--accent); 
            background: rgba(0,0,0,0.2); 
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        /* Action Buttons */
        .btn-skip {
            background: var(--input-bg);
            color: var(--text-secondary);
            border-radius: 50%;
            width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .btn-skip:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
            transform: translateY(-2px);
        }
        .btn-skip:active { transform: scale(0.9); }

        .btn-send {
            background: var(--accent-gradient);
            color: white;
            border-radius: 50%;
            width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--accent-glow);
            flex-shrink: 0;
            border: none;
        }
        .btn-send:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled {
            background: var(--input-bg);
            color: var(--text-secondary);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Typing Indicator Animation */
        .typing-dot {
            width: 4px; height: 4px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.5); }
        }

        /* Scrollbar */
        #messages-area::-webkit-scrollbar { width: 5px; }
        #messages-area::-webkit-scrollbar-track { background: transparent; }
        #messages-area::-webkit-scrollbar-thumb { 
            background: rgba(139, 92, 246, 0.3); 
            border-radius: 10px; 
        }
        #messages-area::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.5); }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button id="theme-btn" class="theme-toggle" aria-label="Toggle Theme">
        <svg id="moon-icon" class="w-5 h-5 text-[var(--text-primary)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <svg id="sun-icon" class="hidden w-5 h-5 text-[var(--text-primary)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
        <div class="satin-card w-full max-w-sm p-8 md:p-10 rounded-[2rem] text-center fade-in">
            <div class="w-20 h-20 bg-[var(--input-bg)] border border-[var(--border)] rounded-full mx-auto flex items-center justify-center mb-6 shadow-inner">
                <span class="text-4xl drop-shadow-md">💬</span>
            </div>
            <h1 class="text-4xl font-bold mb-8 tracking-tight">Text Chat</h1>
            
            <div class="space-y-7">
                <input id="nickname-input" type="text" placeholder="Enter Nickname" class="glass-input w-full p-4 rounded-2xl text-center text-lg font-medium">
                
                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-3 block">I am</label>
                    <div id="my-gender-selector" class="grid grid-cols-2 gap-4">
                        <button class="toggle-btn p-4 rounded-2xl font-semibold" data-gender="male">Male</button>
                        <button class="toggle-btn p-4 rounded-2xl font-semibold" data-gender="female">Female</button>
                    </div>
                </div>

                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-3 block">Looking for</label>
                    <div id="looking-for-selector" class="grid grid-cols-3 gap-3">
                        <button class="toggle-btn p-3 rounded-xl font-medium" data-gender="male">Male</button>
                        <button class="toggle-btn p-3 rounded-xl font-medium" data-gender="female">Female</button>
                        <button class="toggle-btn active p-3 rounded-xl font-medium" data-gender="anyone">Anyone</button>
                    </div>
                </div>

                <button id="start-button" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold p-5 rounded-2xl mt-4 shadow-lg hover:shadow-indigo-500/50 hover:-translate-y-1 active:scale-95 transition-all duration-300 text-lg">
                    Start Chatting
                </button>
            </div>
        </div>
    </div>

    <!-- CHAT UI -->
    <div id="chat-ui" class="flex flex-col h-full hidden absolute inset-0">
        
        <div class="chat-header h-16 flex items-center justify-between px-5 shrink-0 z-10 shadow-sm">
            <div>
                <h2 id="partner-nickname" class="text-lg font-bold leading-tight tracking-tight">Stranger</h2>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]"></span>
                    <p id="status-text" class="text-xs font-semibold text-yellow-500 tracking-wide uppercase">Searching...</p>
                </div>
            </div>
            
            <div id="typing-indicator" class="hidden">
                <div class="flex items-center gap-1 bg-[var(--input-bg)] px-3 py-1.5 rounded-full border border-[var(--border)]">
                    <span class="text-xs text-[var(--accent)] font-semibold mr-1">typing</span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>
        </div>

        <div id="messages-area" class="flex-grow flex flex-col gap-1.5 p-4 overflow-y-auto scroll-smooth">
            <div class="text-center text-xs text-[var(--text-secondary)] mt-6 mb-10 uppercase tracking-widest opacity-70 font-semibold border-b border-[var(--border)] pb-4 mx-8">Conversation Started</div>
            <!-- Messages will appear here -->
        </div>

        <form id="chat-form" class="input-area flex gap-3 items-center shrink-0">
            <button type="button" id="next-button" class="btn-skip" title="Next Stranger">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            </button>

            <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" class="glass-input flex-grow py-3 px-5 rounded-full text-[0.95rem]" disabled>

            <button type="submit" id="send-button" class="btn-send" disabled>
                <svg class="w-5 h-5 translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
            </button>
        </form>
    </div>

    <!-- Ensure Socket.io handles failures gracefully if server is down -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- Theme Logic ---
        const themeBtn = document.getElementById('theme-btn');
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');
        
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateIcons(savedTheme);

        // --- Audio Feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'send') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            }
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons(newTheme);
        });

        function updateIcons(theme) {
            if (theme === 'dark') {
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
            } else {
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
            }
        }

        // --- Chat Logic ---
        const socket = typeof io !== 'undefined' ? io() : { emit: () => {}, on: () => {} };
        let myGender = null, lookingFor = 'anyone';

        const ui = {
            setupScreen: document.getElementById('setup-screen'),
            chatUI: document.getElementById('chat-ui'),
            startBtn: document.getElementById('start-button'),
            nickInput: document.getElementById('nickname-input'),
            partnerName: document.getElementById('partner-nickname'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            typingInd: document.getElementById('typing-indicator'),
            msgsArea: document.getElementById('messages-area'),
            form: document.getElementById('chat-form'),
            input: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-button'),
            nextBtn: document.getElementById('next-button')
        };

        function setupSelectors(id, callback) {
            const container = document.getElementById(id);
            const btns = container.querySelectorAll('.toggle-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    callback(btn.dataset.gender);
                });
            });
        }
        setupSelectors('my-gender-selector', val => myGender = val);
        setupSelectors('looking-for-selector', val => lookingFor = val);

        ui.startBtn.addEventListener('click', () => {
            if (!myGender) return alert("Please select your gender.");
            const nick = ui.nickInput.value.trim() || "Anonymous";
            socket.emit("set-nickname", nick);
            
            ui.setupScreen.classList.add('hidden');
            ui.chatUI.classList.remove('hidden');
            
            findPartner();
        });

        function findPartner() {
            updateStatus('searching');
            // Add slight delay before clearing to allow fade out if needed
            ui.msgsArea.innerHTML = '<div class="text-center text-xs text-[var(--text-secondary)] mt-6 mb-10 uppercase tracking-widest opacity-70 font-semibold border-b border-[var(--border)] pb-4 mx-8">Conversation Started</div>';
            
            const interestString = sessionStorage.getItem('swaploop_interests') || "";
            const interests = interestString.split(',').map(s => s.trim()).filter(s => s);
            
            socket.emit("find-partner", { gender: myGender, lookingFor, type: 'text', interests: interests });
            
            // For Demo/Testing: Simulate finding a partner if no socket server
            if(typeof io === 'undefined') {
                setTimeout(() => updateStatus('connected', 'Test User'), 2000);
            }
        }

        ui.nextBtn.addEventListener('click', () => {
            socket.emit("next");
            findPartner();
        });

        // Enable/Disable send button based on input
        ui.input.addEventListener('input', () => {
            ui.sendBtn.disabled = ui.input.value.trim().length === 0;
            
            socket.emit('typing', true);
            clearTimeout(window.typingTimeout);
            window.typingTimeout = setTimeout(() => socket.emit('typing', false), 2000);
        });

        ui.form.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = ui.input.value.trim();
            if (msg) {
                socket.emit('send-message', { message: msg });
                appendMsg(msg, 'sent');
                playSound('send');
                ui.input.value = '';
                ui.sendBtn.disabled = true;
                socket.emit('typing', false); 
            }
        });

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.textContent = text;
            div.className = `chat-bubble ${type}`;
            ui.msgsArea.appendChild(div);
            
            // Smooth scroll to bottom
            setTimeout(() => {
                ui.msgsArea.scrollTo({
                    top: ui.msgsArea.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        socket.on('partner-typing', (isTyping) => {
            ui.typingInd.style.display = isTyping ? 'block' : 'none';
            if(isTyping) {
                ui.msgsArea.scrollTo({ top: ui.msgsArea.scrollHeight, behavior: 'smooth' });
            }
        });

        socket.on('partner-found', ({ partnerNickname }) => {
            updateStatus('connected', partnerNickname);
        });

        socket.on('receive-message', ({ message }) => {
            appendMsg(message, 'received');
            playSound('receive');
        });

        socket.on('partner-disconnected', () => {
            updateStatus('disconnected');
            // Auto skip after short delay
            setTimeout(() => {
                socket.emit('next');
                findPartner();
            }, 2000); 
        });

        function updateStatus(state, name="Stranger") {
            ui.partnerName.textContent = name;
            ui.input.disabled = (state !== 'connected');
            if(state !== 'connected') ui.sendBtn.disabled = true;
            ui.typingInd.style.display = 'none';

            if (state === 'searching') {
                ui.statusText.textContent = "Searching...";
                ui.statusText.style.color = "#eab308"; // yellow
                ui.statusDot.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]";
            } else if (state === 'connected') {
                ui.statusText.textContent = "Online";
                ui.statusText.style.color = "#22c55e"; // green
                ui.statusDot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]";
                ui.input.disabled = false;
                ui.input.focus();
            } else if (state === 'disconnected') {
                ui.statusText.textContent = "Disconnected";
                ui.statusText.style.color = "#ef4444"; // red
                ui.statusDot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]";
                appendMsg("Stranger has disconnected.", "received"); // Show disconnect message
            }
        }
    </script>
</body>
</html>
