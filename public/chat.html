<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SwapLoop - Text Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* DARK MODE (Premium SwapLoop Identity) */
            --bg: #0a0a0c;
            --surface: rgba(24, 24, 28, 0.7);
            --header-bg: rgba(15, 15, 18, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --border: rgba(255, 255, 255, 0.08);
            
            /* Custom Chat Bubbles */
            --msg-sent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --msg-sent-shadow: rgba(139, 92, 246, 0.25);
            --msg-received: rgba(255, 255, 255, 0.06);
            
            --input-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.85);
            --header-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --border: rgba(0, 0, 0, 0.08);
            
            --msg-sent: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            --msg-sent-shadow: rgba(99, 102, 241, 0.25);
            --msg-received: #ffffff;
            
            --input-bg: rgba(0, 0, 0, 0.03);
            --btn-hover: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100dvh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.04), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(217, 70, 239, 0.04), transparent 40%);
        }

        .hidden { display: none !important; }

        /* Setup Card */
        .satin-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .toggle-btn {
            background: var(--input-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .toggle-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .toggle-btn.active {
            background: var(--accent-gradient);
            color: white; border-color: transparent;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Header */
        .chat-header {
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            height: 70px;
        }

        .header-theme-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-theme-btn:hover { border-color: var(--accent); transform: rotate(15deg) scale(1.05); }
        .header-theme-btn:active { transform: scale(0.95); }

        /* Message Bubbles */
        .chat-bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.45;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            word-wrap: break-word;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .sent {
            background: var(--msg-sent);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: white;
            box-shadow: 0 4px 15px var(--msg-sent-shadow);
        }

        .received {
            background: var(--msg-received);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        @keyframes popIn { to { opacity: 1; transform: scale(1) translateY(0); } }

        /* Bottom Control Bar */
        .bottom-control-bar {
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .btn-skip {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            cursor: pointer;
        }
        .btn-skip:hover { border-color: var(--accent); background: var(--btn-hover); transform: scale(1.05); }
        .btn-skip:active { transform: scale(0.95); }

        /* Report Button */
        .btn-report {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            cursor: pointer;
            border-color: rgba(245, 158, 11, 0.3);
        }
        .btn-report:hover:not(:disabled) {
            background: #f59e0b; color: white;
            transform: scale(1.05); box-shadow: 0 4px 15px rgba(245,158,11,0.4);
        }
        .btn-report:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(80%); }

        .chat-input-wrapper {
            flex-grow: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 4px 16px;
            transition: all 0.3s ease;
        }
        .chat-input-wrapper:focus-within { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 2px var(--accent-glow); }
        .glass-input { background: transparent; border: none; color: var(--text-primary); width: 100%; padding: 10px 0; font-size: 1rem; }
        .glass-input:focus { outline: none; }                                
        
        .btn-send {
            background: var(--accent-gradient);
            color: white;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--accent-glow);
            flex-shrink: 0; border: none; cursor: pointer;
        }
        .btn-send:hover { transform: scale(1.05); box-shadow: 0 6px 20px var(--accent-glow); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { background: var(--input-bg); color: var(--text-secondary); box-shadow: none; cursor: not-allowed; border: 1px solid var(--border); transform: none; }

        /* --- INSTAGRAM STYLE TYPING INDICATOR --- */
        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            width: fit-content;
            margin-top: 4px;
        }
        .typing-dot {
            width: 6px; height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1.2); opacity: 1; background-color: var(--accent); }
        }

        #messages-area::-webkit-scrollbar { width: 5px; }
        #messages-area::-webkit-scrollbar-track { background: transparent; }
        #messages-area::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 10px; }
        #messages-area::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.5); }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom AI / Report Warning Toast */
        #ai-warning {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95); color: white; padding: 12px 24px;
            border-radius: 12px; font-weight: bold; z-index: 100; display: none;
            backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            text-align: center; border: 1px solid #f87171; transition: all 0.3s ease;
        }

        /* Report Modal CSS */
        .radio-label { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; background: var(--input-bg); border: 1px solid var(--border); transition: all 0.2s; }
        .radio-label:hover { border-color: #f59e0b; }
        input[type="radio"]:checked + span { color: #f59e0b; font-weight: 600; }
    </style>
</head>
<body>

    <!-- REPORT MODAL -->
    <div id="report-modal" class="fixed inset-0 z-[1000] hidden flex-col items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="satin-card w-full max-w-xs p-6 rounded-2xl">
            <h3 class="text-xl font-bold text-yellow-500 mb-2">Report User</h3>
            <p class="text-xs text-gray-400 mb-4">Why are you reporting this user?</p>
            
            <div class="flex flex-col gap-3 mb-6 text-sm">
                <label class="radio-label"><input type="radio" name="report-reason" value="harassment" checked> <span>Harassment / Abuse</span></label>
                <label class="radio-label"><input type="radio" name="report-reason" value="spam"> <span>Spam / Bot</span></label>
                <label class="radio-label"><input type="radio" name="report-reason" value="nudity"> <span>Inappropriate Content</span></label>
                <label class="radio-label"><input type="radio" name="report-reason" value="other"> <span>Other</span></label>
            </div>
            
            <div class="flex gap-3">
                <button id="close-report" class="flex-1 p-2.5 rounded-xl border border-gray-600 hover:bg-[var(--btn-hover)] transition">Cancel</button>
                <button id="submit-report" class="flex-1 p-2.5 rounded-xl bg-yellow-600 text-white font-bold shadow-lg hover:bg-yellow-500 transition">Report</button>
            </div>
        </div>
    </div>

    <!-- 24HR BAN SCREEN -->
    <div id="ban-screen" class="fixed inset-0 z-[999] hidden flex-col items-center justify-center p-4 bg-black text-center">
        <h1 class="text-5xl mb-4">🚫</h1>
        <h2 class="text-3xl font-bold text-red-500 mb-2">BANNED</h2>
        <p class="text-gray-300">You have been banned for 24 hours due to multiple reports.</p>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/50 backdrop-blur-md">
        <div class="satin-card w-full max-w-sm p-8 md:p-10 rounded-[2rem] text-center fade-in">
            <div class="w-20 h-20 bg-[var(--input-bg)] border border-[var(--border)] rounded-full mx-auto flex items-center justify-center mb-6 shadow-inner">
                <span class="text-4xl drop-shadow-md">💬</span>
            </div>
            <h1 class="text-4xl font-bold mb-8 tracking-tight">Text Chat</h1>
            
            <div class="space-y-7">
                <input id="nickname-input" type="text" placeholder="Enter Nickname" class="w-full p-4 rounded-2xl text-center text-lg font-medium transition-all" style="background: var(--input-bg); border: 1px solid var(--border); color: var(--text-primary); outline: none;" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
                
                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-3 block">I am</label>
                    <div id="my-gender-selector" class="grid grid-cols-2 gap-4">
                        <button class="toggle-btn p-4 rounded-2xl font-semibold" data-gender="male">Male</button>
                        <button class="toggle-btn p-4 rounded-2xl font-semibold" data-gender="female">Female</button>
                    </div>
                </div>

                <div class="text-left">
                    <label class="text-xs uppercase tracking-widest text-[var(--text-secondary)] font-bold ml-2 mb-3 block">Looking for</label>
                    <div id="looking-for-selector" class="grid grid-cols-3 gap-3">
                        <button class="toggle-btn p-3 rounded-xl font-medium" data-gender="male">Male</button>
                        <button class="toggle-btn p-3 rounded-xl font-medium" data-gender="female">Female</button>
                        <button class="toggle-btn active p-3 rounded-xl font-medium" data-gender="anyone">Anyone</button>
                    </div>
                </div>

                <button id="start-button" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-bold p-5 rounded-2xl mt-4 shadow-lg hover:shadow-indigo-500/50 hover:-translate-y-1 active:scale-95 transition-all duration-300 text-lg">
                    Start Chatting
                </button>
            </div>
        </div>
    </div>

    <!-- CHAT UI -->
    <div id="chat-ui" class="flex flex-col h-full hidden absolute inset-0">
        
        <!-- HEADER -->
        <div class="chat-header flex items-center px-5 shrink-0 z-20 shadow-sm relative justify-between">
            <div class="flex-1 flex flex-col justify-center">
                <h2 id="partner-nickname" class="text-lg font-bold leading-tight tracking-tight">Stranger</h2>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]"></span>
                    <p id="status-text" class="text-xs font-semibold text-yellow-500 tracking-wide uppercase">Searching...</p>
                </div>
            </div>

            <div class="absolute left-1/2 transform -translate-x-1/2 text-xl font-extrabold tracking-widest cursor-default" style="color: var(--accent); text-shadow: 0 0 15px var(--accent-glow);">
                swaploop.in
            </div>

            <div class="flex-1 flex justify-end items-center">
                <button id="theme-btn" class="header-theme-btn" aria-label="Toggle Theme">
                    <svg id="moon-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="sun-icon" class="hidden w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
            </div>
        </div>

        <div id="ai-warning">⚠️ Warning</div>

        <!-- MESSAGES AREA (Instagram Style Layout) -->
        <div id="messages-area" class="flex-grow flex flex-col gap-2 px-4 pt-6 pb-4 overflow-y-auto scroll-smooth">
            
            <div class="text-center text-xs text-[var(--text-secondary)] mt-2 mb-2 uppercase tracking-widest opacity-70 font-semibold bg-[var(--surface)] backdrop-blur-md border border-[var(--border)] py-2 px-4 rounded-full mx-auto shadow-sm">End-to-end encrypted</div>
            
            <!-- Spacer to push messages to the bottom -->
            <div class="flex-grow"></div>
            
            <!-- Typing Indicator (Always stays at the bottom) -->
            <div id="typing-indicator" class="chat-bubble received typing-bubble hidden">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>

        </div>

        <!-- ACCESSIBLE BOTTOM CONTROL BAR -->
        <form id="chat-form" class="bottom-control-bar">
            
            <button type="button" id="next-button" class="btn-skip" title="Next Stranger">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            </button>

            <!-- Report Button -->
            <button type="button" id="report-btn" class="btn-report" title="Report User" disabled>
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
            </button>

            <div class="chat-input-wrapper">
                <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" class="glass-input" disabled>
            </div>

            <button type="submit" id="send-button" class="btn-send" disabled>
                <svg class="w-5 h-5 translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
            </button>
            
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // BAN CHECK
        if (localStorage.getItem('swaploop_ban_v25')) {
            if (Date.now() < parseInt(localStorage.getItem('swaploop_ban_v25'))) {
                document.getElementById('ban-screen').classList.remove('hidden');
                document.getElementById('setup-screen').classList.add('hidden');
                throw new Error("User is currently banned.");
            } else localStorage.removeItem('swaploop_ban_v25');
        }

        // GENERATE DEVICE ID
        let myClientId = localStorage.getItem('swaploop_client_id');
        if (!myClientId) {
            myClientId = 'device_' + Math.random().toString(36).substr(2, 16);
            localStorage.setItem('swaploop_client_id', myClientId);
        }

        // --- Theme Logic ---
        const themeBtn = document.getElementById('theme-btn');
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');
        
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateIcons(savedTheme);

        // --- Audio Feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'send') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            } else if (type === 'receive') {
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            } else if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            }
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        themeBtn.addEventListener('click', () => {
            playSound('click');
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons(newTheme);
        });

        function updateIcons(theme) {
            if (theme === 'dark') {
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
            } else {
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
            }
        }

        // --- Chat Logic ---
        const socket = typeof io !== 'undefined' ? io() : { emit: () => {}, on: () => {} };
        let myGender = null, lookingFor = 'anyone';
        let hasConnectedOnce = false;

        const ui = {
            setupScreen: document.getElementById('setup-screen'),
            chatUI: document.getElementById('chat-ui'),
            startBtn: document.getElementById('start-button'),
            nickInput: document.getElementById('nickname-input'),
            partnerName: document.getElementById('partner-nickname'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            typingInd: document.getElementById('typing-indicator'),
            msgsArea: document.getElementById('messages-area'),
            form: document.getElementById('chat-form'),
            input: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-button'),
            nextBtn: document.getElementById('next-button'),
            reportBtn: document.getElementById('report-btn'),
            reportModal: document.getElementById('report-modal'),
            closeReport: document.getElementById('close-report'),
            submitReport: document.getElementById('submit-report'),
            aiWarning: document.getElementById('ai-warning')
        };

        function setupSelectors(id, callback) {
            const container = document.getElementById(id);
            const btns = container.querySelectorAll('.toggle-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    playSound('click');
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    callback(btn.dataset.gender);
                });
            });
        }
        setupSelectors('my-gender-selector', val => myGender = val);
        setupSelectors('looking-for-selector', val => lookingFor = val);

        ui.startBtn.addEventListener('click', () => {
            playSound('click');
            if (!myGender) return alert("Please select your gender.");
            const nick = ui.nickInput.value.trim() || "Anonymous";
            socket.emit("set-nickname", nick);
            
            ui.setupScreen.classList.add('hidden');
            ui.chatUI.classList.remove('hidden');
            
            findPartner();
        });

        // --- REPORT LOGIC START ---
        ui.reportBtn.addEventListener('click', () => {
            if (!hasConnectedOnce) return;
            ui.reportModal.classList.remove('hidden'); 
            ui.reportModal.classList.add('flex');
        });

        ui.closeReport.addEventListener('click', () => {
            ui.reportModal.classList.add('hidden'); 
            ui.reportModal.classList.remove('flex');
        });

        ui.submitReport.addEventListener('click', () => {
            const reason = document.querySelector('input[name="report-reason"]:checked').value;
            
            socket.emit('report-user', { reason: reason });
            
            ui.reportModal.classList.add('hidden'); 
            ui.reportModal.classList.remove('flex');

            ui.aiWarning.textContent = `✅ Thank you for reporting! We will check and take action.`;
            ui.aiWarning.style.background = 'rgba(34, 197, 94, 0.95)';
            ui.aiWarning.style.borderColor = '#22c55e';
            ui.aiWarning.style.display = 'block';
            
            ui.reportBtn.disabled = true;
            
            setTimeout(() => { 
                ui.aiWarning.style.display = 'none'; 
                ui.aiWarning.style.background = 'rgba(239, 68, 68, 0.95)'; 
                ui.aiWarning.style.borderColor = '#f87171';
            }, 3000);

            socket.emit("next");
            updateStatus('disconnected');
            hasConnectedOnce = false;
        });

        socket.on('you-are-banned', () => {
            localStorage.setItem('swaploop_ban_v25', Date.now() + 24 * 60 * 60 * 1000); 
            location.reload();
        });
        // --- REPORT LOGIC END ---

        function findPartner() {
            updateStatus('searching');
            ui.reportBtn.disabled = true; 
            
            // CAREFULLY clear chat bubbles without destroying the typing indicator
            const oldBubbles = ui.msgsArea.querySelectorAll('.chat-bubble:not(#typing-indicator)');
            oldBubbles.forEach(bubble => bubble.remove());
            
            ui.typingInd.classList.add('hidden');
            
            const interestString = sessionStorage.getItem('swaploop_interests') || "";
            const interests = interestString.split(',').map(s => s.trim()).filter(s => s);
            
            socket.emit("find-partner", { gender: myGender, lookingFor, type: 'text', interests: interests, clientId: myClientId });
        }

        ui.nextBtn.addEventListener('click', () => {
            playSound('click');
            socket.emit("next");
            findPartner();
        });

        // ✨ TYPING INDICATOR EMISSION ✨
        let typingTimeout;
        ui.input.addEventListener('input', () => {
            ui.sendBtn.disabled = ui.input.value.trim().length === 0;
            
            socket.emit('typing', true);
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', false);
            }, 1500);
        });

        ui.form.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = ui.input.value.trim();
            if (msg) {
                socket.emit('send-message', { message: msg });
                appendMsg(msg, 'sent');
                playSound('send');
                ui.input.value = '';
                ui.sendBtn.disabled = true;
                
                socket.emit('typing', false); 
                clearTimeout(typingTimeout);
            }
        });

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.textContent = text;
            div.className = `chat-bubble ${type}`;
            
            // Insert the new message EXACTLY before the typing indicator
            ui.msgsArea.insertBefore(div, ui.typingInd);
            
            setTimeout(() => {
                ui.msgsArea.scrollTop = ui.msgsArea.scrollHeight;
            }, 50);
        }

        // ✨ TYPING INDICATOR RECEPTION ✨
        socket.on('partner-typing', (isTyping) => {
            if(isTyping) {
                ui.typingInd.classList.remove('hidden');
                ui.msgsArea.scrollTop = ui.msgsArea.scrollHeight;
            } else {
                ui.typingInd.classList.add('hidden');
            }
        });

        socket.on('partner-found', ({ partnerNickname }) => {
            updateStatus('connected', partnerNickname);
            hasConnectedOnce = true;
            ui.reportBtn.disabled = false; // ENABLE REPORT WHEN CONNECTED
        });

        socket.on('receive-message', ({ message }) => {
            ui.typingInd.classList.add('hidden'); 
            appendMsg(message, 'received');
            playSound('receive');
        });

        socket.on('partner-disconnected', () => {
            updateStatus('disconnected');
            ui.typingInd.classList.add('hidden'); // Hide typing indicator if they disconnect
        });

        function updateStatus(state, name="Stranger") {
            ui.partnerName.textContent = name;
            ui.input.disabled = (state !== 'connected');
            if(state !== 'connected') ui.sendBtn.disabled = true;
            ui.typingInd.classList.add('hidden');

            if (state === 'searching') {
                ui.statusText.textContent = "Searching...";
                ui.statusText.style.color = "#eab308"; 
                ui.statusDot.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]";
            } else if (state === 'connected') {
                ui.statusText.textContent = "Online";
                ui.statusText.style.color = "#22c55e"; 
                ui.statusDot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]";
                ui.input.disabled = false;
                ui.input.focus();
            } else if (state === 'disconnected') {
                ui.statusText.textContent = "Disconnected";
                ui.statusText.style.color = "#ef4444"; 
                ui.statusDot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]";
                appendMsg("Stranger has disconnected. Click 'Next' to find someone else.", "received"); 
            }
        }
    </script>
</body>
</html>
